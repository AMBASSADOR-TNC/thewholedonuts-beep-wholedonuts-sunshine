name: Validate public site and tools

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/public-site/**'
      - 'scripts/prepare-public-site.sh'
      - 'brain/**'
      - 'counter*/**'
      - 'dashboard/**'
      - 'effort/**'
      - 'entry/**'
      - 'movement-engine/**'
      - 'protocol-engine/**'
      - 'table*/**'
      - 'vault/**'
      - 'donor.html'
      - 'ecosystem.html'
      - 'identity-law.html'
      - 'story.html'
      - 'style.css'
      - 'motion.js'
      - 'tools/domain-funnels/**'
      - '.github/workflows/public-site-and-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check apps/public-site/world/script.js

  pages-readiness:
    name: Verify GitHub Pages deployment readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Pages artifact
        run: sh scripts/prepare-public-site.sh _site
      - name: Verify public entry points
        run: |
          test -f _site/index.html
          test -f _site/world/script.js
          test -f _site/entry/entry-index.html
          test -f _site/table/index.html
          test -f _site/vault/index.html

  domain-funnels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/domain-funnels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: tools/domain-funnels/go.sum
      - run: go test ./...
